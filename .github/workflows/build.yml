name: Automated Windows 11 EXE Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'macos/**'
      - 'goodbyedpi_gui.py'
      - 'app.manifest'
      - 'requirements.txt'
      - '.gitignore'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'macos/**'
      - 'goodbyedpi_gui.py'
      - 'app.manifest'
      - 'requirements.txt'
      - '.gitignore'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  WINDIVERT_URL: https://reqrypt.org/download/WinDivert-2.2.0-D.zip
  WINDIVERT_NAME: WinDivert-2.2.0-D.zip
  WINDIVERT_BASENAME: WinDivert-2.2.0-D
  WINDIVERT_SHA256: 1d461cfdfa7ba88ebcfbb3603b71b703e9f72aba8aeff99a75ce293e6f89d2ba

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Declare short commit variable
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install MinGW-w64
        run: >
          sudo rm /var/lib/man-db/auto-update &&
          sudo DEBIAN_FRONTEND=noninteractive XZ_DEFAULTS="-T0" XZ_OPT="-T0" eatmydata
          apt install -y --no-install-recommends gcc-mingw-w64

      - name: Download WinDivert from cache
        id: windivert-cache
        uses: actions/cache@v4
        with:
          path: ${{ env. WINDIVERT_NAME }}
          key: ${{ env. WINDIVERT_SHA256 }}

      - name: Download WinDivert from the website
        if: steps.windivert-cache.outputs.cache-hit != 'true'
        run: >
          wget ${{ env. WINDIVERT_URL }} &&
          (echo ${{ env. WINDIVERT_SHA256 }} ${{ env. WINDIVERT_NAME }} | sha256sum -c)

      - name: Unpack WinDivert
        run: unzip ${{ env. WINDIVERT_NAME }}

      - name: Compile x86_64
        run: >
          cd src && make clean &&
          make CPREFIX=x86_64-w64-mingw32- BIT64=1 WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x64 -j4

      - name: Prepare x86_64 directory
        run: |
          mkdir goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}
          cp src/goodbyedpi.exe ${{ env.WINDIVERT_BASENAME }}/x64/*.{dll,sys} goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}

      - name: Upload output file x86_64
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}
          path: goodbyedpi_x86_64_${{ steps.vars.outputs.sha_short }}

      - name: Compile i686
        run: >
          cd src && make clean &&
          make CPREFIX=i686-w64-mingw32- WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x86 -j4

      - name: Prepare x86 directory
        run: |
          mkdir goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}
          cp src/goodbyedpi.exe ${{ env.WINDIVERT_BASENAME }}/x86/*.{dll,sys} goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}

      - name: Upload output file x86
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}
          path: goodbyedpi_x86_${{ steps.vars.outputs.sha_short }}

  build-macos:
    name: Build macOS (ciadpi)
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel runner, macos-14 = Apple Silicon (M-series).
        os: [macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Declare short commit variable
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick artifact arch name
        id: arch
        run: |
          if [[ "${{ matrix.os }}" == "macos-13" ]]; then
            echo "name=macos_x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "name=macos_arm64"  >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity-check bash scripts
        run: |
          set -e
          chmod +x macos/build.sh macos/scripts/*.sh
          for f in macos/build.sh macos/scripts/*.sh; do bash -n "$f"; done

      - name: Build ciadpi
        run: ./macos/build.sh

      - name: Stage release directory
        run: |
          set -e
          OUT="goodbyedpi-turkey_${{ steps.arch.outputs.name }}_${{ steps.vars.outputs.sha_short }}"
          mkdir -p "$OUT/bin" "$OUT/scripts" "$OUT/launchd"
          cp macos/bin/ciadpi                                      "$OUT/bin/"
          cp macos/scripts/*.sh                                    "$OUT/scripts/"
          cp macos/launchd/com.cagritaskn.goodbyedpi-turkey.plist.template "$OUT/launchd/"
          # A copy of _lib.sh is required by every script — it's already
          # in macos/scripts/, so the recursive copy above covers it.
          cp macos/README.md                                       "$OUT/README.md" || true
          chmod +x "$OUT/scripts/"*.sh
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}

  build-gui-windows:
    name: Build CustomTkinter GUI (Windows 11)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install GUI and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download official GoodbyeDPI release files
        shell: pwsh
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'GoodbyeDPI-Turkey-GUI-Build'
          }
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/ValdikSS/GoodbyeDPI/releases/latest' `
            -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^goodbyedpi-.*\.zip$' } |
            Select-Object -First 1
          if (-not $asset) {
            throw "No compiled GoodbyeDPI ZIP asset was found in release $($release.tag_name)."
          }

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extractRoot = Join-Path $env:RUNNER_TEMP 'goodbyedpi-release'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force

          $exe = Get-ChildItem -LiteralPath $extractRoot -Filter 'goodbyedpi.exe' -File -Recurse |
            Where-Object { $_.Directory.Name -in @('x86_64', 'x64') } |
            Select-Object -First 1
          if (-not $exe) {
            throw "The release ZIP did not contain an x64 goodbyedpi.exe."
          }

          $releaseDirectory = $exe.Directory.FullName
          foreach ($file in @('goodbyedpi.exe', 'WinDivert.dll', 'WinDivert64.sys')) {
            $source = Join-Path $releaseDirectory $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required x64 release file was not found: $source"
            }
            Copy-Item -LiteralPath $source -Destination $env:GITHUB_WORKSPACE
          }

          # Preserve the requested legacy filename; the x64 driver uses WinDivert64.sys.
          Copy-Item `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'WinDivert64.sys') `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'WinDivert.sys')
          Write-Host "Prepared GoodbyeDPI $($release.tag_name) x64 files."

      - name: Build single-file Windows application
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --manifest app.manifest
          --add-binary "goodbyedpi.exe;."
          --add-binary "WinDivert.sys;."
          --add-binary "WinDivert64.sys;."
          --add-binary "WinDivert.dll;."
          --name goodbyedpi_gui goodbyedpi_gui.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: goodbyedpi_gui-windows-x64
          path: dist/goodbyedpi_gui.exe
          if-no-files-found: error
